version: '3.8'

services:
  autorca-suite:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autorca-enterprise-suite
    restart: always
    ports:
      - "${HOST_PORT:-8080}:${PORT:-3000}"
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3000}
      - HOST=0.0.0.0
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GITHUB_PERSONAL_ACCESS_TOKEN=${GITHUB_PERSONAL_ACCESS_TOKEN:-}
    volumes:
      - autorca_data:/app/data

volumes:
  autorca_data:
    driver: local
