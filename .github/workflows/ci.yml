name: AutoRCA & Fix Enterprise Suite CI

on:
  push:
    branches: [ "main", "production", "develop" ]
  pull_request:
    branches: [ "main", "production", "develop" ]

jobs:
  test-and-build:
    name: Build & E2E Test Suite
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck & Lint Codebase
        run: npm run lint

      - name: Execute E2E & Unit Test Suite
        run: npm test

      - name: Build Application & Worktree Harness Bundle
        run: npm run build
        env:
          NODE_ENV: production
