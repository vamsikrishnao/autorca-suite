name: AutoRCA & Fix Enterprise Suite CI

on:
  push:
    branches: [ "main", "production", "develop" ]
  pull_request:
    branches: [ "main", "production", "develop" ]

jobs:
  test-and-build:
    name: Build & E2E Test Suite
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        # Node 18 is deprecated and lacks support for Tailwind CSS v4 native engines.
        # Upgrading to 20 and 22 provides modern compilation features.
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # Explicitly forces npm to fetch native platform bindings for Linux containers
      - name: Install Dependencies
        run: npm ci --include=optional

      - name: Typecheck & Lint Codebase
        run: npm run lint

      - name: Execute E2E & Unit Test Suite
        run: npm test

      # OXIDE_DISABLE=1 forces Tailwind v4 to gracefully fall back to a JavaScript engine 
      # if the runner environment has locking issues with native binary paths.
      - name: Build Application & Worktree Harness Bundle
        run: npm run build
        env:
          NODE_ENV: production
          OXIDE_DISABLE: 1 
